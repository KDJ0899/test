[project]
name = "ai-project"
version = "0.1.0"
description = "LangGraph 기반 AI Agent workflow 예제 (레퍼런스 코드)"
requires-python = ">=3.11"
dependencies = [
    "langgraph==0.2.60",
    "langchain-core==0.3.29",
    "langchain==0.3.14",
    "langchain-openai==0.2.14",
    "langchain-text-splitters==0.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teams", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"  # async def 테스트를 마커 없이 실행
